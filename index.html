<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>WIKI - Jules DUCASSE--FERNANDEZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
  
  <!-- Docsify CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  
  <!-- Docsify Search Plugin CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-search@1/dist/docsify-search.min.css">
  
  <!-- Custom CSS -->
  <style>
    :root {
      --theme-color: #4f46e5;
    }
    .app-name {
      font-weight: bold;
      color: var(--theme-color);
    }
    .cover-main {
      background-image: url('img/science.jpg');
      background-size: cover;
      background-position: center;
    }
    .cover-main h1 {
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      font-size: 2.5em;
    }
    .cover-main p {
      color: white;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Docsify JS -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Docsify Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-search@1/dist/docsify-search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@1"></script>
  
  <!-- Docsify Configuration -->
  <script>
    window.$docsify = {
      name: 'WIKI - Jules DUCASSE--FERNANDEZ',
      repo: 'ClashRCode/WIKI',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      coverpage: true,
      onlyCover: false,
      search: {
        maxAge: 86400000, // 24 hours
        paths: 'auto',
        placeholder: 'Rechercher dans le wiki...',
        noData: 'Aucun résultat trouvé',
        depth: 4,
        hideOtherSidebarContent: false
      },
      pagination: {
        previousText: '← Précédent',
        nextText: 'Suivant →',
        crossChapter: true
      },
      themeable: {
        readyTransition: true,
        afterTransition: true
      }
    }
  </script>
</body>
</html>
