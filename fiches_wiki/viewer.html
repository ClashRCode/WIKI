<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afficheur de document</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>html,body,#viewer{height:100%;margin:0}</style>
</head>
<body class="bg-slate-50 text-gray-800">
  <header class="bg-white shadow p-4">
    <div class="w-full flex items-center justify-between px-4">
      <div class="flex items-center space-x-3">
        <a href="/" class="text-sm text-indigo-600 hover:underline">Accueil</a>
        <span id="fileName" class="text-lg font-medium"></span>
      </div>
      <div class="flex items-center space-x-3">
        <a id="downloadLink" class="text-sm text-gray-600 hover:underline" target="_blank" rel="noopener noreferrer">Télécharger</a>
        <button id="openPdfBtn" class="text-sm text-gray-600 hover:underline">Ouvrir en PDF</button>
        <button id="printBtn" class="text-sm text-gray-600 hover:underline">Imprimer</button>
        <button id="fsBtn" class="text-sm text-gray-600 hover:underline">Plein écran</button>
      </div>
    </div>
  </header>

  <div id="viewer" class="w-full mt-4 h-[calc(100%-96px)]">
    <div id="frameContainer" class="w-full h-full bg-white shadow-inner relative"></div>
  </div>

  <div id="fallback" class="hidden p-4 text-center text-sm text-gray-700">
    <p>Impossible de charger l'affichage intégré. Vous pouvez télécharger le fichier ou l'ouvrir dans une autre application.</p>
    <p class="mt-2"><a id="fallbackLink" class="text-indigo-600 hover:underline" target="_blank" rel="noopener noreferrer">Ouvrir le fichier</a></p>
  </div>

  <script>
      /*
        viewer.html
        - Reçoit un paramètre de requête `file` contenant le chemin relatif du .doc/.docx
          Exemple : viewer.html?file=Histoire/Mon%20doc.docx
        - Construit une URL absolue vers le fichier et l'encode pour l'iframe Office Online
        - Affiche le nom du fichier et un lien de téléchargement

        Limitations importantes:
        - L'outil Office Online (view.officeapps.live.com) exige que la ressource soit
          accessible publiquement (pas seulement sur localhost). Sur GitHub Pages cela fonctionne.
        - Si vous testez localement (localhost), l'iframe peut rester vide pour des raisons
          de sécurité / accessibilité réseau.
      */

      // Récupère un paramètre de l'URL
      function getParam(name){
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const fileParam = getParam('file');
      const fileNameEl = document.getElementById('fileName');
      const dl = document.getElementById('downloadLink');
      const container = document.getElementById('frameContainer');

      // If the opened file is inside a category folder (contains '/'), remove the "Accueil" link
      // This applies to all categories so the viewer doesn't navigate away from the embedded doc.
      try {
        const homeLink = document.querySelector('a[href="/"]');
        if (fileParam && fileParam.includes('/')) {
          if (homeLink) homeLink.remove();
        }
      } catch (e) {
        // non-blocking: if DOM lookup fails, continue normally
        console.warn('Could not modify home link visibility', e);
      }

      if(!fileParam){
        // Message d'erreur visible si l'URL est appelée sans paramètre
        container.innerHTML = '<p class="p-4 text-red-600">Aucun fichier spécifié.</p>';
        throw new Error('file param missing');
      }

      // Construire une URL absolue à partir du chemin relatif fourni.
      // Important : `new URL(..., window.location.href)` résout correctement les chemins.
      const fileUrl = new URL(decodeURIComponent(fileParam), window.location.href).href;

      // Affiche le nom du fichier (dernier segment du chemin)
      fileNameEl.textContent = decodeURIComponent(fileParam).split('/').pop();

      // Lien direct vers le fichier (ouvre dans un nouvel onglet)
      dl.href = fileUrl;
      dl.textContent = 'Télécharger';

      /*
        Intégration Office Online :
        - Office propose une URL d'embed : https://view.officeapps.live.com/op/embed.aspx?src=<URL>
        - Nous encodons l'URL du fichier et l'utilisons comme src de l'iframe
        - L'iframe occupe tout le conteneur `#frameContainer`
      */
      const officeSrc = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(fileUrl);
      const iframe = document.createElement('iframe');
      iframe.src = officeSrc;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.frameBorder = '0';
      iframe.title = 'Afficheur de document';
      iframe.loading = 'lazy';
      container.appendChild(iframe);

      // Toolbar buttons
      const dlBtn = document.getElementById('downloadLink');
      const openPdfBtn = document.getElementById('openPdfBtn');
      const printBtn = document.getElementById('printBtn');
      const fsBtn = document.getElementById('fsBtn');
      const fallback = document.getElementById('fallback');
      const fallbackLink = document.getElementById('fallbackLink');

      dl.href = fileUrl;
      fallbackLink.href = fileUrl;

      // If the file is already a PDF, open PDF directly
      function isPDF(url){ return url.toLowerCase().endsWith('.pdf'); }
      openPdfBtn.addEventListener('click', ()=>{
        if(isPDF(fileUrl)) window.open(fileUrl, '_blank', 'noopener');
        else window.open(officeSrc, '_blank', 'noopener');
      });

      printBtn.addEventListener('click', ()=>{
        // Best-effort: open the file in a new tab where user can print
        window.open(fileUrl, '_blank', 'noopener');
      });

      fsBtn.addEventListener('click', ()=>{
        const el = document.getElementById('frameContainer');
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else alert('Mode plein écran non pris en charge par ce navigateur.');
      });

      // Fallback handling: if iframe doesn't fire load within timeout, show fallback
      let loaded = false;
      const loadTimeout = setTimeout(()=>{
        if(!loaded){
          container.style.display = 'none';
          fallback.classList.remove('hidden');
        }
      }, 8000);

      iframe.addEventListener('load', ()=>{
        loaded = true;
        clearTimeout(loadTimeout);
      });

      // --- View counter: store in localStorage and broadcast to other tabs ---
      (function(){
        try{
          const key = 'views:' + fileParam;
          const prev = parseInt(localStorage.getItem(key) || '0', 10) || 0;
          const next = prev + 1;
          localStorage.setItem(key, String(next));
          // Update displayed file name and show a labeled view count
          const name = decodeURIComponent(fileParam).split('/').pop();
          const fileNameElLocal = document.getElementById('fileName');
          if (fileNameElLocal) {
            fileNameElLocal.textContent = name;
            let fv = document.getElementById('fileViews');
            if (!fv) {
              fv = document.createElement('span');
              fv.id = 'fileViews';
              fv.className = 'ml-2 text-sm text-gray-500';
              fileNameElLocal.parentElement.appendChild(fv);
            }
            fv.textContent = `Nombre de lectures : ${next}`;
          }
          // Broadcast the update so other pages can refresh counts live
          try{ const bc = new BroadcastChannel('views'); bc.postMessage({ file: fileParam, count: next }); }catch(e){}
        }catch(e){ console.warn('Could not update view counter', e); }
      })();

      // Note de sécurité : le viewer charge un domaine externe. Nous ajoutons rel=noopener
      // sur le lien de téléchargement pour éviter les attaques par ouverture de fenêtre.
    </script>
  </body>
  </html>
