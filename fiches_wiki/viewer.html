  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afficheur de document</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.0/mammoth.browser.min.js"></script>
  <style>html,body,#viewer{height:100%;margin:0}</style>
 </head>
<body class="bg-slate-50 text-gray-800">
  <header class="bg-white shadow p-4">
    <div class="w-full flex items-center justify-between px-4">
      <div class="flex items-center space-x-3">
        <a href="/" class="text-sm text-indigo-600 hover:underline">Accueil</a>

      <div class="flex items-center gap-3">

        <button id="pauseReadBtn" type="button" class="text-sm px-3 py-2 rounded-lg bg-amber-500 text-white hover:bg-amber-600 transition hidden">⏸ Pause</button>

  <!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Afficheur de document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      Petit style pour que le conteneur prenne toute la hauteur disponible.
      Gardez-le minimal pour rester compatible avec GitHub Pages / navigateurs.
    -->
    <style>html,body,#viewer{height:100%;margin:0}</style>
   </head>
  <body class="bg-slate-50 text-gray-800">
    <!-- En‑tête contenant le nom du fichier et un lien de téléchargement direct -->
    <header class="bg-white shadow p-4">
      <div class="w-full flex items-center justify-between px-4">
        <div class="flex items-center space-x-3">
          <!-- Lien vers l'accueil du site -->
          <a href="/" class="text-sm text-indigo-600 hover:underline">Accueil</a>
          <!-- Le nom du fichier affiché dynamiquement par le script -->
          <span id="fileName" class="text-lg font-medium"></span>
        </div>
        <div>
          <!-- Lien de téléchargement direct : utile si l'affichage embarqué échoue -->
          <a id="downloadLink" class="text-sm text-gray-600 hover:underline" target="_blank" rel="noopener noreferrer">Télécharger</a>
        </div>
      </div>
    </header>

    <!-- Zone principale contenant l'iframe Office Online -->
    <div id="viewer" class="w-full mt-4 h-[calc(100%-96px)]">
      <div id="frameContainer" class="w-full h-full bg-white shadow-inner"></div>
    </div>

    <script>
      /*
        viewer.html
        - Reçoit un paramètre de requête `file` contenant le chemin relatif du .doc/.docx
          Exemple : viewer.html?file=Histoire/Mon%20doc.docx
        - Construit une URL absolue vers le fichier et l'encode pour l'iframe Office Online
        - Affiche le nom du fichier et un lien de téléchargement

        Limitations importantes:
        - L'outil Office Online (view.officeapps.live.com) exige que la ressource soit
          accessible publiquement (pas seulement sur localhost). Sur GitHub Pages cela fonctionne.
        - Si vous testez localement (localhost), l'iframe peut rester vide pour des raisons
          de sécurité / accessibilité réseau.
      */

      // Récupère un paramètre de l'URL
      function getParam(name){
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const fileParam = getParam('file');
      const fileNameEl = document.getElementById('fileName');
      const dl = document.getElementById('downloadLink');
      const container = document.getElementById('frameContainer');
      const readAloudBtn = document.getElementById('readAloudBtn');
      const pauseReadBtn = document.getElementById('pauseReadBtn');
      const stopReadBtn = document.getElementById('stopReadBtn');

      function chooseFrenchVoice() {
        const synth = window.speechSynthesis;
        if (!synth || !synth.getVoices) return null;
        const voices = synth.getVoices();
        const preferred = voices.find(v => /fr/i.test(v.lang) && /french|france|fran[cç]ais/i.test(v.name))
          || voices.find(v => /fr/i.test(v.lang));
        return preferred || null;
      }

      function normalizeSpeechText(text) {
        return text
          .replace(/\r\n/g, '\n')
          .replace(/(\d+)\.(\d{1,3})/g, '$1 virgule $2')
          .replace(/(\d+),(\d{1,3})/g, '$1 virgule $2')
          .replace(/\s+/g, ' ')
          .replace(/\[[^\]]*\]/g, ' ')
          .replace(/\u00A0/g, ' ')
          .trim();
      }

      function isLikelyHeading(text) {
        const cleaned = text.replace(/\s+/g, ' ').trim();
        if (!cleaned) return false;
        if (/^(sommaire|table des mati(?:eres|ères)|index|contenu|résumé|resume)$/i.test(cleaned)) return false;
        const words = cleaned.split(/\s+/).filter(Boolean);
        if (words.length > 12) return false;
        if (/(?:\bchapitre\b|\bpartie\b|\bsection\b|\bobjectif\b|\bintroduction\b|\bconclusion\b)/i.test(cleaned)) {
          return true;
        }
        return /^[A-ZÀ-Ö0-9][A-Za-zÀ-Öéèêëàçùûîïôöœæ0-9'’\- ]{2,80}$/.test(cleaned) && !/[.!?]$/.test(cleaned);
      }

      function buildSpeechBlocks(text) {
        const normalized = normalizeSpeechText(text);
        const rawBlocks = normalized.split(/\n+/).map(part => part.trim()).filter(Boolean);
        const blocks = [];

        rawBlocks.forEach(block => {
          const cleaned = block.replace(/\s+/g, ' ').trim();
          if (!cleaned) return;

          if (/^(sommaire|table des mati(?:eres|ères)|index|contenu|résumé|resume)$/i.test(cleaned)) {
            return;
          }

          if (isLikelyHeading(cleaned)) {
            blocks.push(`Changement de chapitre. ${cleaned}.`);
            return;
          }

          blocks.push(cleaned);
        });

        return blocks.length ? blocks : [normalized];
      }

      function readTextOutLoud(source, config = {}) {
        const synth = window.speechSynthesis;
        if (!synth) {
          console.warn("La synthèse vocale n'est pas supportée dans ce navigateur.");
          return { ok: false, reason: 'speechSynthesis unavailable' };
        }

        const options = {
          lang: 'fr-FR',
          rate: 0.6,
          pitch: 0.75,
          volume: 1,
          pauseBeforeBlock: 1500,
          pauseAfterBlock: 1100,
          ...config
        };

        const sourceText = typeof source === 'string'
          ? source
          : source && typeof source.textContent === 'string'
            ? source.textContent
            : '';

        const cleaned = normalizeSpeechText(sourceText);
        if (!cleaned) {
          return { ok: false, reason: 'No text to read' };
        }

        synth.cancel();

        const blocks = buildSpeechBlocks(cleaned);
        let index = 0;
        let isPaused = false;

        function speakBlockAt(indexValue) {
          const block = blocks[indexValue].trim();
          if (!block) {
            index += 1;
            return playNextChunk();
          }

          const utterance = new SpeechSynthesisUtterance(block);
          const voice = chooseFrenchVoice();
          utterance.lang = options.lang;
          utterance.rate = options.rate;
          utterance.pitch = options.pitch;
          utterance.volume = options.volume;
          utterance.text = utterance.text.replace(/\s+/g, ' ').trim();
          if (voice) utterance.voice = voice;

          if (/Changement de chapitre\./i.test(block)) {
            utterance.rate = options.rate * 0.9;
            utterance.pitch = options.pitch + 0.15;
          }

          utterance.onstart = () => {
            if (window.__speechPauseTimer) {
              window.clearTimeout(window.__speechPauseTimer);
              window.__speechPauseTimer = null;
            }
          };

          utterance.onend = () => {
            if (isPaused) return;
            index += 1;
            if (index < blocks.length) {
              const wait = window.setTimeout(() => {
                if (!isPaused) playNextChunk();
              }, options.pauseAfterBlock);
              window.__speechPauseTimer = wait;
            } else {
              if (stopReadBtn) stopReadBtn.classList.add('hidden');
              if (pauseReadBtn) pauseReadBtn.classList.add('hidden');
              if (readAloudBtn) readAloudBtn.textContent = '🔊 Lire à voix haute';
            }
          };

          synth.speak(utterance);
          return { ok: true, currentChunk: block };
        }

        function playNextChunk() {
          if (isPaused) return { ok: true, paused: true };
          if (index >= blocks.length) {
            if (stopReadBtn) stopReadBtn.classList.add('hidden');
            if (pauseReadBtn) pauseReadBtn.classList.add('hidden');
            if (readAloudBtn) readAloudBtn.textContent = '🔊 Lire à voix haute';
            return { ok: true, finished: true };
          }

          if (window.__speechPauseTimer) {
            window.clearTimeout(window.__speechPauseTimer);
            window.__speechPauseTimer = null;
          }

          const wait = window.setTimeout(() => {
            if (!isPaused) {
              speakBlockAt(index);
            }
          }, options.pauseBeforeBlock);
          window.__speechPauseTimer = wait;

          return { ok: true, waitingBeforeBlock: true };
        }

        if (stopReadBtn) stopReadBtn.classList.remove('hidden');
        if (pauseReadBtn) pauseReadBtn.classList.remove('hidden');
        if (readAloudBtn) readAloudBtn.textContent = '🔊 En cours…';

        isPaused = false;
        return playNextChunk();
      }

      async function extractDocumentText() {
        if (!fileParam) return null;

        try {
          const fileUrl = new URL(decodeURIComponent(fileParam), window.location.href).href;
          const response = await fetch(fileUrl, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('Fetch document failed: ' + response.status);
          }

          const arrayBuffer = await response.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          const extractedText = (result && result.value || '').replace(/\s+/g, ' ').trim();
          return extractedText || null;
        } catch (error) {
          console.warn('Impossible d’extraire le texte du document .docx:', error);
          return null;
        }
      }

      function getSpeechText() {
        const fallbackTitle = (fileParam ? decodeURIComponent(fileParam).split('/').pop() : document.title || 'Document')
          .replace(/\.[^.]+$/, '')
          .replace(/[_-]+/g, ' ')
          .trim();

        const bodyText = document.body ? document.body.textContent || '' : '';
        const visibleText = bodyText.replace(/\s+/g, ' ').trim();

        if (visibleText && visibleText.length > fallbackTitle.length + 15) {
          return visibleText;
        }

        return `Document ${fallbackTitle}. Cette fiche est accessible dans le wiki. Consultez le contenu pour plus de détails.`;
      }

      let currentReadSession = null;

      if (readAloudBtn) {
        readAloudBtn.addEventListener('click', async () => {
          if (currentReadSession && currentReadSession.isPaused) {
            currentReadSession.isPaused = false;
            if (window.speechSynthesis && window.speechSynthesis.resume) {
              window.speechSynthesis.resume();
            }
            if (pauseReadBtn) pauseReadBtn.textContent = '⏸ Pause';
            return;
          }

          readAloudBtn.disabled = true;
          readAloudBtn.textContent = '⏳ Extraction…';

          const docText = await extractDocumentText();
          const textToRead = docText || getSpeechText();

          currentReadSession = {
            isPaused: false,
            blocks: buildSpeechBlocks(normalizeSpeechText(textToRead)),
            index: 0
          };

          readTextOutLoud(textToRead, {
            lang: 'fr-FR',
            rate: 0.65,
            pitch: 0.75,
            pauseBeforeBlock: 1500,
            pauseAfterBlock: 1100
          });

          readAloudBtn.disabled = false;
          readAloudBtn.textContent = '🔊 Lire à voix haute';
        });
      }

      if (pauseReadBtn) {
        pauseReadBtn.addEventListener('click', () => {
          if (!window.speechSynthesis) return;
          if (pauseReadBtn.textContent.includes('Pause')) {
            window.speechSynthesis.pause();
            pauseReadBtn.textContent = '▶️ Reprendre';
            if (currentReadSession) currentReadSession.isPaused = true;
          } else {
            window.speechSynthesis.resume();
            pauseReadBtn.textContent = '⏸ Pause';
            if (currentReadSession) currentReadSession.isPaused = false;
          }
        });
      }

      if (stopReadBtn) {
        stopReadBtn.addEventListener('click', () => {
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
          }
          if (window.__speechPauseTimer) {
            window.clearTimeout(window.__speechPauseTimer);
            window.__speechPauseTimer = null;
          }
          if (pauseReadBtn) {
            pauseReadBtn.classList.add('hidden');
            pauseReadBtn.textContent = '⏸ Pause';
          }
          stopReadBtn.classList.add('hidden');
          if (readAloudBtn) readAloudBtn.textContent = '🔊 Lire à voix haute';
          currentReadSession = null;
        });
      }

      // If the opened file is inside a category folder (contains '/'), remove the "Accueil" link
      // This applies to all categories so the viewer doesn't navigate away from the embedded doc.
      try {
        const homeLink = document.querySelector('a[href="/"]');
        if (fileParam && fileParam.includes('/')) {
          if (homeLink) homeLink.remove();
        }
      } catch (e) {
        // non-blocking: if DOM lookup fails, continue normally
        console.warn('Could not modify home link visibility', e);
      }

      if(!fileParam){
        // Message d'erreur visible si l'URL est appelée sans paramètre
        container.innerHTML = '<p class="p-4 text-red-600">Aucun fichier spécifié.</p>';
        throw new Error('file param missing');
      }

      // Construire une URL absolue à partir du chemin relatif fourni.
      // Important : `new URL(..., window.location.href)` résout correctement les chemins.
      const fileUrl = new URL(decodeURIComponent(fileParam), window.location.href).href;

      // Affiche le nom du fichier (dernier segment du chemin)
      fileNameEl.textContent = decodeURIComponent(fileParam).split('/').pop();

      // Lien direct vers le fichier (ouvre dans un nouvel onglet)
      dl.href = fileUrl;
      dl.textContent = 'Télécharger';

      /*
        Intégration Office Online :
        - Office propose une URL d'embed : https://view.officeapps.live.com/op/embed.aspx?src=<URL>
        - Nous encodons l'URL du fichier et l'utilisons comme src de l'iframe
        - L'iframe occupe tout le conteneur `#frameContainer`
      */
      const officeSrc = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(fileUrl);
      const iframe = document.createElement('iframe');
      iframe.src = officeSrc;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.frameBorder = '0';
      iframe.title = 'Afficheur de document';
      container.appendChild(iframe);

      // --- View counter: store in localStorage and broadcast to other tabs ---
      (function(){
        try{
          const key = 'views:' + fileParam;
          const prev = parseInt(localStorage.getItem(key) || '0', 10) || 0;
          const next = prev + 1;
          localStorage.setItem(key, String(next));
          // Update displayed file name and show a labeled view count
          const name = decodeURIComponent(fileParam).split('/').pop();
          const fileNameElLocal = document.getElementById('fileName');
          if (fileNameElLocal) {
            fileNameElLocal.textContent = name;
            let fv = document.getElementById('fileViews');
            if (!fv) {
              fv = document.createElement('span');
              fv.id = 'fileViews';
              fv.className = 'ml-2 text-sm text-gray-500';
              fileNameElLocal.parentElement.appendChild(fv);
            }
            fv.textContent = `Nombre de lectures : ${next}`;
          }
          // Broadcast the update so other pages can refresh counts live
          try{ const bc = new BroadcastChannel('views'); bc.postMessage({ file: fileParam, count: next }); }catch(e){}
        }catch(e){ console.warn('Could not update view counter', e); }
      })();

      // Note de sécurité : le viewer charge un domaine externe. Nous ajoutons rel=noopener
      // sur le lien de téléchargement pour éviter les attaques par ouverture de fenêtre.
    </script>
  </body>
  </html>
