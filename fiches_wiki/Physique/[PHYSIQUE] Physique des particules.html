  <!-- Bouton Retour en haut (même style que votre wiki) -->
  <button
    id="backToTopBtn"
    onclick="scrollToTop()"
    class="fixed bottom-6 right-6 bg-indigo-600 text-white p-3 rounded-full shadow-lg hover:bg-indigo-700 transition-opacity opacity-0 invisible z-50">
    ↑ Top
  </button>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Mise en surbrillance du sommaire lors du scroll
      const tocLinks = document.querySelectorAll('.toc a');
      const headings = document.querySelectorAll('.content h1, .content h2, .content h3, .content h4');
      
      window.addEventListener('scroll', function() {
        let current = '';
        headings.forEach(heading => {
          const sectionTop = heading.offsetTop;
          if (window.scrollY >= sectionTop - 100) {
            current = heading.id;
          }
        });
        
        tocLinks.forEach(link => {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + current) {
            link.classList.add('active');
          }
        });
      });
      
      // Bouton retour en haut
      const backToTopBtn = document.getElementById('backToTopBtn');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          backToTopBtn.classList.remove('opacity-0', 'invisible');
          backToTopBtn.classList.add('opacity-100', 'visible');
        } else {
          backToTopBtn.classList.add('opacity-0', 'invisible');
          backToTopBtn.classList.remove('opacity-100', 'visible');
        }
      });
    });
    
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
