<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biologie - Fiches</title>
  <script src="https://cdn.tailwindcss.com"></script>
 </head>
<body class="bg-slate-50 text-gray-800 font-sans">

  <!-- Navigation -->
  <header class="bg-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">WIKI - Jules DUCASSE--FERNANDEZ</h1>
      <nav class="space-x-4">
        <a href="../index.html" class="hover:underline">Accueil</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 space-y-6">
    <div class="flex items-center space-x-3 mb-4">
      <img src="../img/biologie.png" alt="biologie" class="w-10 h-10" />
      <h2 id="pageTitle" class="text-3xl font-bold text-indigo-700">Biologie</h2>
      <script>
        // Récupère et affiche les fichiers .doc/.docx du dossier `Biologie/`.
        // Tentative 1: fetch de l'index du dossier (expose HTML par python -m http.server).
        // Tentative 2: lecture de `Biologie/index.json` (généré par script local) si la première échoue.
        async function loadBiologyFiles() {
          const dir = 'Biologie/';
          const container = document.getElementById('listContainer');

          async function renderList(files) {
            const unique = Array.from(new Set(files));
            unique.sort((a,b) => a.localeCompare(b, 'fr', {sensitivity: 'base'}));
            if (unique.length === 0) {
              container.innerHTML = '<p class="text-sm text-gray-500">Aucune fiche trouvée.</p>';
              return;
            }
            const ul = document.createElement('ul');
            ul.className = 'list-disc pl-6 space-y-2';
            unique.forEach(filename => {
              let display = filename.replace(/^\[BIO\]\s*/i, '');
              display = display.replace(/\.(docx|doc)$/i, '');
              const li = document.createElement('li');
              const a = document.createElement('a');
              // Open using viewer.html to embed Office Online when available
              a.href = 'viewer.html?file=' + encodeURIComponent(dir + filename);
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.textContent = display;
              a.className = 'text-indigo-700 hover:underline';
              li.appendChild(a);
              ul.appendChild(li);
            });
            container.innerHTML = '';
            container.appendChild(ul);
          }

          // Try 1: fetch directory listing (HTML)
          try {
            const res = await fetch(dir, {cache: 'no-store'});
            if (res.ok && res.headers.get('content-type') && res.headers.get('content-type').includes('text/html')) {
              const text = await res.text();
              const parser = new DOMParser();
              const doc = parser.parseFromString(text, 'text/html');
              const anchors = Array.from(doc.querySelectorAll('a'));
              const files = anchors
                .map(a => a.getAttribute('href'))
                .filter(href => href && (href.toLowerCase().endsWith('.docx') || href.toLowerCase().endsWith('.doc')))
                .map(href => decodeURIComponent(href.replace(/\/+$/,'')));
              await renderList(files);
              return;
            }
            // If not HTML, fallthrough to JSON attempt
          } catch (err) {
            console.warn('Liste dossier inaccessible, essai de fallback JSON', err);
          }

          // Try 2: fetch pre-generated JSON index
          try {
            const jres = await fetch(dir + 'index.json', {cache: 'no-store'});
            if (jres.ok) {
              const data = await jres.json();
              if (Array.isArray(data)) {
                await renderList(data.filter(f => typeof f === 'string'));
                return;
              }
            }
          } catch (err) {
            console.warn('Fallback JSON indisponible', err);
          }

          // Aucun mécanisme disponible
          container.innerHTML = '<p class="text-sm text-red-500">Impossible de lister le dossier. Exécutez un serveur (ex. `python -m http.server`) ou générez `Biologie/index.json`.</p>';
        }

        document.addEventListener('DOMContentLoaded', loadBiologyFiles);
      </script>
    </div>

    <div id="listContainer">
      <p class="text-sm text-gray-500">Chargement…</p>
    </div>
  </main>

  <!-- Bouton Retour en haut -->
  <button 
    id="backToTopBtn" 
    onclick="scrollToTop()" 
    class="fixed bottom-6 right-6 bg-indigo-600 text-white p-3 rounded-full shadow-lg hover:bg-indigo-700 transition-opacity opacity-0 invisible z-50">
    ↑ Top
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        backToTopBtn.classList.remove('opacity-0','invisible');
        backToTopBtn.classList.add('opacity-100','visible');
      } else {
        backToTopBtn.classList.add('opacity-0','invisible');
        backToTopBtn.classList.remove('opacity-100','visible');
      }
    });
    function scrollToTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }
  </script>

</body>
</html>
