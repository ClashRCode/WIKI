<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biologie - Fiches</title>
  <script src="https://cdn.tailwindcss.com"></script>
 </head>
<body class="bg-slate-50 text-gray-800 font-sans">

  <!-- Navigation -->
  <header class="bg-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">WIKI - Jules DUCASSE--FERNANDEZ</h1>
      <nav class="space-x-4">
        <a href="../index.html" class="hover:underline">Accueil</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 space-y-6">
    <div class="flex items-center gap-4 mb-4">
      <img src="../img/biologie.png" alt="Biologie" class="w-12 h-12">
      <div class="flex-1">
        <h2 class="text-3xl font-bold text-indigo-700">Biologie</h2>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 transition">← Retour</a>
    </div>

    <!-- Liste des Fiches -->
    <p class="text-lg">Liste des fiches</p>

    <div id="listContainer">
      <ul id="fileList" class="list-disc pl-6 space-y-2">
        <li>Chargement...</li>
      </ul>
    </div>

    <script>
      // Charge dynamiquement la liste des fichiers .doc/.docx présents
      // dans le dossier `fiches_wiki/Biologie/` et les affiche triés.
      // Remarques :
      // - Le script fonctionne uniquement si le serveur HTTP expose
      //   un index de répertoire (ex. `python -m http.server`).
      // - Il filtre les fichiers .doc et .docx et enlève le préfixe
      //   "[BIO]" pour l'affichage.
      async function loadDocxList() {
        // Élément <ul> qui contiendra la liste construite
        const container = document.getElementById('fileList');
        try {
          // Récupère la page d'index du dossier `Biologie/`
          const res = await fetch('Biologie/');
          if (!res.ok) throw new Error('Impossible de lister le dossier');

          // Récupère le HTML de l'index et le parse pour extraire les liens
          const text = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const anchors = Array.from(doc.querySelectorAll('a'));

          // Transforme en noms de fichiers et ne garde que les .doc/.docx
          const files = anchors
            .map(a => a.getAttribute('href'))
            // ignore les liens parent (../) et garde les extensions .doc/.docx
            .filter(h => h && !h.startsWith('../') && /\.(docx|doc)$/i.test(h));

          // Supprime les doublons éventuels
          const unique = Array.from(new Set(files));

          // Fonction utilitaire : retire le préfixe [BIO] et l'extension
          function displayName(fname) {
            return fname
              .replace(/^\[BIO\]\s*/i, '') // supprime [BIO] si présent
              .replace(/\.[^.]+$/, '')       // retire l'extension
              .trim();                        // enlève les espaces superflus
          }

          // Trie alphabétiquement selon le nom affiché (insensible à la casse)
          unique.sort((a, b) => {
            const A = displayName(a).toLowerCase();
            const B = displayName(b).toLowerCase();
            return A.localeCompare(B);
          });

          // Message si aucun document
          if (unique.length === 0) {
            container.innerHTML = '<li>Aucun document trouvé.</li>';
            return;
          }

          // Reconstruit la liste dans le DOM
          container.innerHTML = '';
          unique.forEach(fname => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            // Lien vers le fichier dans le dossier `Biologie/`
            a.href = 'Biologie/' + fname;
            // Texte du lien : nom nettoyé
            a.textContent = displayName(fname);
            li.appendChild(a);
            container.appendChild(li);
          });

        } catch (e) {
          // Si la lecture de l'index HTTP échoue (ex. pas d'index de dossier),
          // on tente de charger un fichier JSON pré-généré `Biologie/list.json`
          // généré par le script `fiches_wiki/generate_bio_list.py`.
          console.warn('Fetch directory failed, trying JSON fallback', e);
          try {
            const res2 = await fetch('Biologie/list.json');
            if (!res2.ok) throw new Error('JSON fallback introuvable');
            const json = await res2.json();
            if (!Array.isArray(json) || json.length === 0) {
              container.innerHTML = '<li>Aucun document trouvé.</li>';
              return;
            }
            // trie et affiche comme précédemment
            json.sort((a,b) => {
              const A = a.replace(/^\[BIO\]\s*/i, '').replace(/\.[^.]+$/, '').toLowerCase();
              const B = b.replace(/^\[BIO\]\s*/i, '').replace(/\.[^.]+$/, '').toLowerCase();
              return A.localeCompare(B);
            });
            container.innerHTML = '';
            json.forEach(fname => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = 'Biologie/' + fname;
              a.textContent = fname.replace(/^\[BIO\]\s*/i, '').replace(/\.[^.]+$/, '');
              li.appendChild(a);
              container.appendChild(li);
            });
            return;
          } catch (e2) {
            container.innerHTML = '<li>Impossible de charger la liste automatiquement.</li>';
            console.warn(e2);
          }
        }
      }

      // Lance le chargement une fois le DOM prêt
      document.addEventListener('DOMContentLoaded', loadDocxList);
    </script>

  </main>

  <!-- Bouton Retour en haut -->
  <button 
    id="backToTopBtn" 
    onclick="scrollToTop()" 
    class="fixed bottom-6 right-6 bg-indigo-600 text-white p-3 rounded-full shadow-lg hover:bg-indigo-700 transition-opacity opacity-0 invisible z-50">
    ↑ Top
  </button>

</body>
</html>
