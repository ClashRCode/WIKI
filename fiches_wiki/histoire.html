<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histoire - Fiches</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-800 font-sans">

  <!-- Navigation -->
  <header class="bg-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">WIKI - Jules DUCASSE--FERNANDEZ</h1>
      <nav class="space-x-4">
        <a href="../index.html" class="hover:underline">Accueil</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 space-y-6">
    <div class="flex items-center space-x-3 mb-4">
      <img src="../img/histoire.png" alt="histoire" class="w-10 h-10" />
      <h2 id="pageTitle" class="text-3xl font-bold text-indigo-700">Histoire</h2>
      <script>
        // Liste statique des fichiers disponibles dans Histoire/
        const FOLDER_PATH = 'Histoire/';

        const categoryFiles = [
          { name: '[HISTOIRE] Programme Apollo.html', display: 'Programme Apollo', type: 'html' },
          { name: '[HISTOIRE] Programme Artemis.html', display: 'Programme Artemis', type: 'html' },
          { name: '[HISTOIRE] Programme Gemini.html', display: 'Programme Gemini', type: 'html' },
          { name: '[HISTOIRE] Programme ISS.html', display: 'Programme ISS', type: 'html' },
          { name: '[HISTOIRE] Programme Navette spatiale.html', display: 'Programme Navette spatiale', type: 'html' },
          { name: '[HISTOIRE] Programme Shuttle-Mir.html', display: 'Programme Shuttle-Mir', type: 'html' },
          { name: '[HISTOIRE] Projet Manhattan.html', display: 'Projet Manhattan', type: 'html' },
          { name: '[HISTOIRE] Événement de la Toungouska.html', display: 'Événement de la Toungouska', type: 'html' },
        ];

        function makeRow(fileKey, display, href) {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between py-2';
          const a = document.createElement('a');
          a.href = href;
          a.textContent = display;
          a.className = 'text-indigo-700 hover:underline flex-1';
          a.dataset.file = fileKey;
          const span = document.createElement('span');
          span.className = 'ml-4 text-sm text-gray-500 text-right w-48 viewcount';
          span.textContent = `Nombre de lectures : ${parseInt(localStorage.getItem('views:' + fileKey) || '0', 10) || 0}`;
          li.appendChild(a);
          li.appendChild(span);
          return li;
        }

        function renderList(files) {
          if (files.length === 0) {
            document.getElementById('listContainer').innerHTML = '<p class="text-sm text-gray-500">Aucune fiche trouvée.</p>';
            return;
          }
          const ul = document.createElement('ul');
          ul.className = 'space-y-2 divide-y divide-gray-100';
          files.forEach(f => ul.appendChild(makeRow(f.key, f.display, f.href)));
          document.getElementById('listContainer').innerHTML = '';
          document.getElementById('listContainer').appendChild(ul);
        }

        function loadFiles() {
          const files = categoryFiles.map(file => {
            const fileKey = FOLDER_PATH + file.name;
            if (file.type === 'html') {
              return { key: fileKey, display: file.display, href: encodeURI(fileKey) };
            } else {
              return { key: fileKey, display: file.display, href: 'viewer.html?file=' + encodeURIComponent(fileKey) };
            }
          });

          files.sort((a, b) => a.display.localeCompare(b.display, 'fr', { sensitivity: 'base' }));
          renderList(files);
        }

        try {
          const bc = new BroadcastChannel('views');
          bc.onmessage = (ev) => {
            try {
              const f = ev.data.file;
              const el = document.querySelector(`[data-file="${CSS.escape(f)}"]`);
              if (el) {
                const span = el.parentElement.querySelector('.viewcount');
                if (span) span.textContent = `Nombre de lectures : ${ev.data.count}`;
              }
            } catch (e) {}
          };
        } catch (e) {}

        document.addEventListener('DOMContentLoaded', loadFiles);
      </script>
    </div>

    <div id="listContainer">
      <p class="text-sm text-gray-500">Chargement…</p>
    </div>
  </main>

  <!-- Bouton Retour en haut -->
  <button
    id="backToTopBtn"
    onclick="scrollToTop()"
    class="fixed bottom-6 right-6 bg-indigo-600 text-white p-3 rounded-full shadow-lg hover:bg-indigo-700 transition-opacity opacity-0 invisible z-50">
    ↑ Top
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        backToTopBtn.classList.remove('opacity-0','invisible');
        backToTopBtn.classList.add('opacity-100','visible');
      } else {
        backToTopBtn.classList.add('opacity-0','invisible');
        backToTopBtn.classList.remove('opacity-100','visible');
      }
    });
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  </script>

</body>
</html>
