<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histoire - Fiches</title>
  <script src="https://cdn.tailwindcss.com"></script>
 </head>
<body class="bg-slate-50 text-gray-800 font-sans">

  <header class="bg-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">Fiches - Histoire</h1>
      <nav class="space-x-4">
        <a href="../index.html" class="hover:underline">Accueil</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 space-y-6">
    <div class="flex items-center space-x-3 mb-4">
      <img src="../img/histoire.png" alt="histoire" class="w-10 h-10" />
      <h2 id="pageTitle" class="text-3xl font-bold text-indigo-700">Histoire</h2>
      <div class="ml-auto">
        <a href="../index.html" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 transition">← Retour</a>
      </div>
    </div>

    <p class="text-lg">Liste des fiches (ordre alphabétique)</p>
    <div id="listContainer">
      <p class="text-sm text-gray-500">Chargement…</p>
    </div>

    <script>
      async function loadFiles() {
        const dir = 'Histoire/';
        const container = document.getElementById('listContainer');

        function render(files) {
          const unique = Array.from(new Set(files));
          unique.sort((a,b) => a.localeCompare(b, 'fr', {sensitivity: 'base'}));
          if (unique.length === 0) { container.innerHTML = '<p class="text-sm text-gray-500">Aucune fiche trouvée.</p>'; return; }
          const ul = document.createElement('ul'); ul.className = 'list-disc pl-6 space-y-2';
          unique.forEach(filename => { let display = filename.replace(/^\[.*?\]\s*/i, '').replace(/\.(docx|doc)$/i, ''); const li = document.createElement('li'); const a = document.createElement('a'); a.href = dir + filename; a.textContent = display; a.className = 'text-indigo-700 hover:underline'; li.appendChild(a); ul.appendChild(li); });
          container.innerHTML = ''; container.appendChild(ul);
        }

        try { const res = await fetch(dir, {cache:'no-store'}); if (res.ok && res.headers.get('content-type') && res.headers.get('content-type').includes('text/html')) { const text = await res.text(); const parser = new DOMParser(); const doc = parser.parseFromString(text, 'text/html'); const anchors = Array.from(doc.querySelectorAll('a')); const files = anchors.map(a => a.getAttribute('href')).filter(h => h && (h.toLowerCase().endsWith('.docx')||h.toLowerCase().endsWith('.doc'))).map(h => decodeURIComponent(h.replace(/\/+$/,''))); render(files); return; } } catch(e){ console.warn(e); }

        try { const jres = await fetch(dir + 'index.json', {cache:'no-store'}); if (jres.ok) { const data = await jres.json(); if (Array.isArray(data)) { render(data.filter(f => typeof f === 'string')); return; } } } catch(e) { console.warn(e); }

        container.innerHTML = '<p class="text-sm text-red-500">Impossible de lister le dossier. Exécutez un serveur ou générez index.json.</p>';
      }
      document.addEventListener('DOMContentLoaded', loadFiles);
    </script>
  </main>

</body>
</html>
