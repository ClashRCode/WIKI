<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physique - Fiches</title>
  <script src="https://cdn.tailwindcss.com"></script>
 </head>
<body class="bg-slate-50 text-gray-800 font-sans">

  <!-- Navigation -->
  <header class="bg-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">WIKI - Jules DUCASSE--FERNANDEZ</h1>
      <nav class="space-x-4">
        <a href="../index.html" class="hover:underline">Accueil</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 space-y-6">
    <div class="flex items-center space-x-3 mb-4">
      <img src="../img/physique.png" alt="physique" class="w-10 h-10" />
      <h2 id="pageTitle" class="text-3xl font-bold text-indigo-700">Physique</h2>
      <script>
        // Récupère et affiche les fichiers .doc/.docx du dossier `Physique/`.
        // Tentative 1: fetch de l'index du dossier (expose HTML par python -m http.server).
        // Tentative 2: lecture de `Physique/index.json` (généré par script local) si la première échoue.
        async function loadBiologyFiles() {
          const dir = 'Physique/';
          const container = document.getElementById('listContainer');

          async function renderList(files) {
            const unique = Array.from(new Set(files));
            unique.sort((a,b) => a.localeCompare(b, 'fr', {sensitivity: 'base'}));
            if (unique.length === 0) {
              container.innerHTML = '<p class="text-sm text-gray-500">Aucune fiche trouvée.</p>';
              return;
            }
            const ul = document.createElement('ul');
            ul.className = 'space-y-2 divide-y divide-gray-100';
            unique.forEach(filename => {
              let display = filename.replace(/^\[PHYSIQUE\]\s*/i, '');
              display = display.replace(/\.(docx|doc)$/i, '');
              const li = document.createElement('li');
              li.className = 'flex items-center justify-between py-2';
              const a = document.createElement('a');
              const fileKey = dir + filename;
              // Open with viewer to display in-browser when possible
              a.href = 'viewer.html?file=' + encodeURIComponent(fileKey);
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.textContent = display;
              a.className = 'text-indigo-700 hover:underline flex-1';
              a.dataset.file = fileKey;
              const span = document.createElement('span');
              span.className = 'ml-4 text-sm text-gray-500 text-right w-48 viewcount';
              span.textContent = `Nombre de lectures : ${parseInt(localStorage.getItem('views:' + fileKey) || '0', 10) || 0}`;
              li.appendChild(a);
              li.appendChild(span);
              ul.appendChild(li);
            });
            container.innerHTML = '';
            container.appendChild(ul);
          }

          // Try 1: fetch directory listing (HTML)
          try {
            const res = await fetch(dir, {cache: 'no-store'});
            if (res.ok && res.headers.get('content-type') && res.headers.get('content-type').includes('text/html')) {
              const text = await res.text();
              const parser = new DOMParser();
              const doc = parser.parseFromString(text, 'text/html');
              const anchors = Array.from(doc.querySelectorAll('a'));
              const files = anchors
                .map(a => a.getAttribute('href'))
                .filter(href => href && (href.toLowerCase().endsWith('.docx') || href.toLowerCase().endsWith('.doc')))
                .map(href => decodeURIComponent(href.replace(/\/+$/,'')));
              await renderList(files);
              return;
            }
            // If not HTML, fallthrough to JSON attempt
          } catch (err) {
            console.warn('Liste dossier inaccessible, essai de fallback JSON', err);
          }

          // Try 2: fetch pre-generated JSON index
          try {
            const jres = await fetch(dir + 'index.json', {cache: 'no-store'});
            if (jres.ok) {
              const data = await jres.json();
              if (Array.isArray(data)) {
                // support array of strings or array of objects { filename, path, title }
                const files = data
                  .map(item => {
                    if (typeof item === 'string') return item;
                    if (item && typeof item === 'object') {
                      if (item.filename) return item.filename;
                      if (item.path) return item.path.split('/').pop();
                      if (item.title) return item.title + '.docx';
                    }
                    return null;
                  })
                  .filter(f => typeof f === 'string');
                await renderList(files);
                return;
              }
            }
          } catch (err) {
            console.warn('Fallback JSON indisponible', err);
          }

          // Aucun mécanisme disponible
          container.innerHTML = `<p class="text-sm text-red-500">Impossible de lister le dossier. Exécutez un serveur (ex. \`python -m http.server\`) ou générez \`${dir}index.json\`.</p>`;
        }

        try{
          const bc = new BroadcastChannel('views');
          bc.onmessage = (ev)=>{
            try{
              const f = ev.data.file;
              const el = document.querySelector(`[data-file="${f}"]`);
              if(el){ const span = el.parentElement.querySelector('.viewcount'); if(span) span.textContent = `Nombre de lectures : ${ev.data.count}`; }
            }catch(e){}
          };
        }catch(e){}

        document.addEventListener('DOMContentLoaded', loadBiologyFiles);
      </script>
    </div>

    <div id="listContainer">
      <p class="text-sm text-gray-500">Chargement…</p>
    </div>
  </main>

  <!-- Bouton Retour en haut -->
  <button 
    id="backToTopBtn" 
    onclick="scrollToTop()" 
    class="fixed bottom-6 right-6 bg-indigo-600 text-white p-3 rounded-full shadow-lg hover:bg-indigo-700 transition-opacity opacity-0 invisible z-50">
    ↑ Top
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        backToTopBtn.classList.remove('opacity-0','invisible');
        backToTopBtn.classList.add('opacity-100','visible');
      } else {
        backToTopBtn.classList.add('opacity-0','invisible');
        backToTopBtn.classList.remove('opacity-100','visible');
      }
    });
    function scrollToTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }
  </script>

</body>
</html>
